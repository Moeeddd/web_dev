databases:
  - name: maritime-postgres
    databaseName: horizon_command
    user: horizon_user
    plan: free

services:
  - type: pserv
    name: maritime-redis
    env: docker
    rootDir: redis
    plan: free

  - type: web
    name: maritime-backend
    env: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: maritime-postgres
          property: connectionString
      - key: REDIS_URL
        value: redis://maritime-redis:6379
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: maritime-frontend
    env: docker
    rootDir: frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_WS_URL
        sync: false
